<!doctype html><html lang="ko"><meta charset="utf-8"><title>학교 연결 검증</title><style>body{margin:0;background:#18231e;color:white;font:14px system-ui}canvas{display:block}nav{position:fixed;top:12px;left:12px;display:flex;gap:6px}button{padding:9px}#state{position:fixed;bottom:15px;left:20px;background:#18231edd;padding:12px}</style><nav><button>교실</button><button>문과 복도</button><button>복도 끝</button><button>계단</button><button>1층 출입구</button><button>문 열기</button></nav><output id="state">로딩 중</output><script type="module">
import * as T from 'three';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import {loadEnvironment} from '/src/world/loadEnvironment.js';import {CollisionWorld} from '/src/core/CollisionWorld.js';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.15;document.body.append(r.domElement);const s=new T.Scene(),pmrem=new T.PMREMGenerator(r),room=new RoomEnvironment();s.environment=pmrem.fromScene(room,.04).texture;s.environmentIntensity=.5;room.dispose();pmrem.dispose();s.background=new T.Color(0xc6d5d9);s.add(new T.HemisphereLight(0xe8f2ff,0xa59980,2.3));let sun=new T.DirectionalLight(0xfff0d3,2.8);sun.position.set(12,24,15);s.add(sun);const c=new T.PerspectiveCamera(75,innerWidth/innerHeight,.05,120),collision=new CollisionWorld(),w=await loadEnvironment(collision);s.add(w.root);const poses=[[[3.75,6.05,-4.5],[-4,5.8,-4.5]],[[-2.5,6.05,-1.13],[-6.2,5.8,-1.13]],[[-5.5,6.05,44],[-5.1,5.8,49.5]],[[-3.8,6.05,52.4],[-3.8,3.6,56.3]],[[-5,1.65,45],[-7.6,1.5,35]]];let pose=0;function show(i){pose=i;c.position.fromArray(poses[i][0]);c.lookAt(new T.Vector3(...poses[i][1]));}show(0);document.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{if(i<5)show(i);else {w.doors.forEach(d=>d.open=!d.open);}});r.setAnimationLoop(()=>{w.update(.016,new T.Vector3(c.position.x,c.position.y-1.65,c.position.z));r.render(s,c);document.querySelector('#state').textContent=`${document.querySelectorAll('button')[pose].textContent} · ${r.info.render.calls} draw calls · ${r.info.render.triangles.toLocaleString()} visible triangles · collision ${w.stats.collisionTriangles.toLocaleString()}`;});
</script></html>
