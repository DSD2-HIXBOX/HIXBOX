<!doctype html><html lang="ko"><meta charset="utf-8"><title>추가 계단실 · 렌더링 검증</title><style>body{margin:0;background:#c6d5d9;font:13px sans-serif;color:white}canvas{display:block}nav{position:fixed;top:20px;left:20px;padding:16px;background:#20382de6}button{padding:10px;margin-right:6px;cursor:pointer}p{margin-bottom:0}</style><canvas></canvas><nav><strong>추가 계단실 · 렌더링 검증</strong><p><button id="entry">연결부</button><button id="down">하행 계단</button><button id="bottom">아래층</button></p><p id="state">학교 모델 로딩 중…</p></nav><script type="module">
import * as T from 'three';import {loadEnvironment} from '/src/world/loadEnvironment.js';import {CollisionWorld} from '/src/core/CollisionWorld.js';
const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.15;const s=new T.Scene();s.background=new T.Color(0xc6d5d9);s.add(new T.HemisphereLight(0xe8f2ff,0xa59980,2.3));const light=new T.DirectionalLight(0xfff0d3,2.8);light.position.set(-12,19,-8);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-23,right:23,top:23,bottom:-23,near:.5,far:70});light.shadow.normalBias=.035;light.shadow.bias=-.0003;s.add(light);const c=new T.PerspectiveCamera(70,innerWidth/innerHeight,.05,120);const w=await loadEnvironment(new CollisionWorld(),{maxAnisotropy:r.capabilities.getMaxAnisotropy()});s.add(w.root);
function pose(name,position,target){c.position.copy(position);c.lookAt(target);s.updateMatrixWorld(true);r.render(s,c);document.querySelector('#state').textContent=name+' · 실제 연결 장면 / 원본 계단 재질';}
document.querySelector('#entry').onclick=()=>pose('연결부',new T.Vector3(7.3,4.85,14.12),new T.Vector3(11,4.5,14.12));document.querySelector('#down').onclick=()=>pose('하행 계단',new T.Vector3(14.8,4.85,12.62),new T.Vector3(18.7,2,12.7));document.querySelector('#bottom').onclick=()=>pose('아래층',new T.Vector3(14.7,1.65,14.62),new T.Vector3(18.4,3,14.62));document.querySelector('#down').click();
</script></html>
